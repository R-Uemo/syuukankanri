<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="meta-theme-color" content="#F6F2EB">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sora & Tsuki">
    <link id="favicon-link" rel="icon" type="image/png">
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180">
    <link id="manifest-link" rel="manifest">
    <title>Sora & Tsuki — 朝と夜のルーティーン</title>
    <!-- Google Fonts: Cormorant Garamond, Shippori Mincho, Inter, Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for gentle sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'Shippori Mincho', 'serif'],
                        mincho: ['Shippori Mincho', 'serif'],
                    },
                    colors: {
                        morning: {
                            bg: '#F6F2EB',
                            card: 'rgba(255, 255, 255, 0.76)',
                            subtle: 'rgba(235, 228, 217, 0.65)',
                            text: '#231F1B',
                            muted: '#787067',
                            accent: '#BE6E32',
                            gold: '#D89B52',
                            accentSoft: 'rgba(190, 110, 50, 0.11)',
                        },
                        night: {
                            bg: '#090D18',
                            card: 'rgba(20, 27, 45, 0.72)',
                            subtle: 'rgba(34, 45, 72, 0.65)',
                            text: '#EDF0F7',
                            muted: '#8E9BB5',
                            accent: '#90A2FF',
                            gold: '#DFC58E',
                            accentSoft: 'rgba(144, 162, 255, 0.14)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            transition: background-color 0.7s cubic-bezier(0.22, 1, 0.36, 1), color 0.6s ease;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* アンビエント光のオーブ（背景の空気感） */
        .ambient-orb {
            position: fixed;
            border-radius: 9999px;
            filter: blur(85px);
            pointer-events: none;
            z-index: 0;
            transition: background 1.2s ease, opacity 1.2s ease, transform 1.2s ease;
        }
        @keyframes slowFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(14px, -18px) scale(1.06); }
        }
        .animate-float-slow {
            animation: slowFloat 14s ease-in-out infinite;
        }
        .animate-float-reverse {
            animation: slowFloat 18s ease-in-out infinite reverse;
        }

        /* 繊細なガラス質感 */
        .glass-morning {
            background: rgba(255, 255, 255, 0.74);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 32px -12px rgba(68, 52, 34, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        .glass-night {
            background: rgba(20, 27, 45, 0.68);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(148, 163, 184, 0.14);
            box-shadow: 0 12px 36px -12px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* プログレスリング＆天体アニメーション */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.65s cubic-bezier(0.22, 1, 0.36, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .celestial-transition {
            transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes checkPop {
            0% { transform: scale(0.8); }
            55% { transform: scale(1.16); }
            100% { transform: scale(1); }
        }
        .animate-check {
            animation: checkPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .star-twinkle {
            animation: twinkle 3.6s ease-in-out infinite;
        }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }

        /* 音声入力中の柔らかなパルスアニメーション */
        @keyframes voicePulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.45); }
            70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .voice-listening {
            background-color: #E11D48 !important;
            color: #FFFFFF !important;
            border-color: transparent !important;
            animation: voicePulse 1.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        /* ホーム画面起動（スタンドアロン）時のセーフエリア対応 */
        .safe-top {
            padding-top: calc(1.25rem + env(safe-area-inset-top));
        }
        .safe-bottom-nav {
            bottom: calc(1rem + env(safe-area-inset-bottom));
        }
        .safe-bottom-space {
            padding-bottom: calc(7rem + env(safe-area-inset-bottom));
        }
    </style>
</head>
<body class="min-h-screen antialiased relative">

    <!-- 背景アンビエント光のレイヤー -->
    <div id="orb-top" class="ambient-orb w-80 h-80 -top-24 -right-20 animate-float-slow"></div>
    <div id="orb-bottom" class="ambient-orb w-96 h-96 top-1/2 -left-32 animate-float-reverse"></div>

    <!-- 祝福用紙吹雪キャンバス -->
    <canvas id="confetti-canvas"></canvas>

    <!-- メインアプリコンテナ -->
    <div id="app" class="relative z-10 max-w-xl mx-auto min-h-screen flex flex-col safe-bottom-space">
        
        <!-- ヘッダー -->
        <header class="sticky top-0 z-30 px-5 safe-top pb-3 transition-colors duration-500" id="main-header">
            <div class="flex items-center justify-between gap-3">
                <!-- ブランド・日付 -->
                <div>
                    <div class="flex items-center gap-2">
                        <span id="header-greeting" class="font-serif italic text-xs tracking-[0.18em] uppercase opacity-70">Good Morning</span>
                        <span class="w-1 h-1 rounded-full bg-current opacity-30"></span>
                        <span id="header-date" class="text-[11px] tracking-wide opacity-60"></span>
                    </div>
                    <h1 class="font-serif text-2xl font-medium tracking-wide mt-0.5 leading-none">
                        Sora <span class="italic font-normal opacity-60">&amp;</span> Tsuki
                    </h1>
                </div>

                <!-- 朝・夜 切り替えセグメント & サウンド切替 & ホーム画面追加 -->
                <div class="flex items-center gap-1.5 sm:gap-2">
                    <button id="install-app-btn" onclick="openInstallModal()" title="ホーム画面に追加" class="p-2.5 rounded-full transition-all duration-300 focus:outline-none" aria-label="ホーム画面に追加">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/><path d="M12 7v6"/><path d="m9 10 3 3 3-3"/></svg>
                    </button>
                    <button id="sound-toggle-btn" onclick="toggleSound()" title="効果音のオン/オフ" class="p-2.5 rounded-full transition-all duration-300 focus:outline-none" aria-label="サウンド切替">
                    </button>
                    <div id="period-switcher" class="flex p-1 rounded-full border transition-all duration-300">
                        <button onclick="setPeriod('morning')" id="btn-period-morning" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium transition-all duration-300">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                            <span>朝</span>
                        </button>
                        <button onclick="setPeriod('night')" id="btn-period-night" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium transition-all duration-300">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                            <span>夜</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ領域 -->
        <main id="main-content" class="flex-1 px-5 pt-2 space-y-5">
            <!-- JSで描画 -->
        </main>

        <!-- フローティング・ボトムナビゲーション -->
        <div class="fixed safe-bottom-nav left-0 right-0 z-30 px-5 pointer-events-none">
            <nav id="bottom-nav" class="max-w-md mx-auto rounded-full px-2 py-1.5 pointer-events-auto transition-all duration-500">
                <div class="grid grid-cols-3 gap-1">
                    <button onclick="setTab('today')" id="nav-today" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-full transition-all duration-300">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>
                        <span class="text-xs font-medium">今日</span>
                    </button>
                    <button onclick="setTab('routines')" id="nav-routines" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-full transition-all duration-300">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                        <span class="text-xs font-medium">設定・曜日</span>
                    </button>
                    <button onclick="setTab('insights')" id="nav-insights" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-full transition-all duration-300">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><circle cx="12" cy="12" r="5"/></svg>
                        <span class="text-xs font-medium">記録</span>
                    </button>
                </div>
            </nav>
        </div>
    </div>

    <!-- タスク追加・編集モーダル -->
    <div id="task-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm p-0 sm:p-4">
        <div id="task-modal-card" class="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-fade-up max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h2 id="modal-title" class="font-mincho text-lg font-medium tracking-wide">ルーティーンを追加</h2>
                <button onclick="closeTaskModal()" class="p-2 rounded-full opacity-60 hover:opacity-100 transition-opacity" aria-label="閉じる">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <form id="task-form" onsubmit="saveTaskForm(event)" class="space-y-5">
                <input type="hidden" id="edit-task-id">

                <!-- 時間帯選択 -->
                <div>
                    <label class="block text-xs font-medium opacity-70 mb-2">時間帯</label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button type="button" onclick="selectFormPeriod('morning')" id="form-period-morning" class="py-2.5 px-4 rounded-2xl border text-sm font-medium flex items-center justify-center gap-2 transition-all">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/></svg>
                            朝のルーティーン
                        </button>
                        <button type="button" onclick="selectFormPeriod('night')" id="form-period-night" class="py-2.5 px-4 rounded-2xl border text-sm font-medium flex items-center justify-center gap-2 transition-all">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                            夜のルーティーン
                        </button>
                    </div>
                </div>

                <!-- タイトル -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="task-title-input" class="text-xs font-medium opacity-70">項目名</label>
                        <span id="voice-hint-task-title" class="text-[11px] opacity-50">「白湯を飲む 5分」のように話せます</span>
                    </div>
                    <div class="relative flex items-center">
                        <input type="text" id="task-title-input" required maxlength="40" placeholder="例：白湯を飲む、ストレッチをする" class="w-full pl-4 pr-12 py-3 rounded-2xl border text-sm focus:outline-none focus:ring-2 transition-all">
                        <button type="button" id="voice-btn-task-title" onclick="toggleVoiceInput('task-title-input', { parseDuration: true })" title="音声で入力" aria-label="項目名を音声で入力" class="absolute right-2 p-2 rounded-xl transition-all opacity-75 hover:opacity-100">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <!-- 所要時間 -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="task-duration-input" class="text-xs font-medium opacity-70">所要時間（分）</label>
                        <span class="text-[11px] opacity-55">タイマーの目安になります</span>
                    </div>
                    <div class="flex items-center gap-2 mb-2">
                        <input type="number" id="task-duration-input" required min="1" max="180" value="5" class="w-24 px-3.5 py-2.5 rounded-2xl border text-sm font-medium text-center focus:outline-none focus:ring-2">
                        <span class="text-sm opacity-75">分</span>
                        <div class="flex-1 flex items-center justify-end gap-1.5 flex-wrap">
                            <button type="button" onclick="setDurationPreset(3)" class="px-2.5 py-1.5 rounded-xl text-xs border opacity-75 hover:opacity-100 transition-opacity">3分</button>
                            <button type="button" onclick="setDurationPreset(5)" class="px-2.5 py-1.5 rounded-xl text-xs border opacity-75 hover:opacity-100 transition-opacity">5分</button>
                            <button type="button" onclick="setDurationPreset(10)" class="px-2.5 py-1.5 rounded-xl text-xs border opacity-75 hover:opacity-100 transition-opacity">10分</button>
                            <button type="button" onclick="setDurationPreset(15)" class="px-2.5 py-1.5 rounded-xl text-xs border opacity-75 hover:opacity-100 transition-opacity">15分</button>
                            <button type="button" onclick="setDurationPreset(30)" class="px-2.5 py-1.5 rounded-xl text-xs border opacity-75 hover:opacity-100 transition-opacity">30分</button>
                        </div>
                    </div>
                </div>

                <!-- 実施する曜日 -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-medium opacity-70">実施する曜日</label>
                        <div class="flex gap-1.5">
                            <button type="button" onclick="setDayPreset('all')" class="text-[11px] px-2.5 py-0.5 rounded-lg border opacity-75 hover:opacity-100">毎日</button>
                            <button type="button" onclick="setDayPreset('weekdays')" class="text-[11px] px-2.5 py-0.5 rounded-lg border opacity-75 hover:opacity-100">平日</button>
                            <button type="button" onclick="setDayPreset('weekends')" class="text-[11px] px-2.5 py-0.5 rounded-lg border opacity-75 hover:opacity-100">週末</button>
                        </div>
                    </div>
                    <div id="form-days-container" class="grid grid-cols-7 gap-1.5"></div>
                    <p id="days-error" class="text-xs text-rose-500 mt-1.5 hidden">少なくとも1つの曜日を選択してください。</p>
                </div>

                <!-- メモ（任意） -->
                <div>
                    <label for="task-note-input" class="block text-xs font-medium opacity-70 mb-1.5">ひとことメモ（任意）</label>
                    <div class="relative flex items-center">
                        <input type="text" id="task-note-input" maxlength="60" placeholder="例：深呼吸しながらゆっくり行う" class="w-full pl-4 pr-12 py-2.5 rounded-2xl border text-sm focus:outline-none focus:ring-2 transition-all">
                        <button type="button" id="voice-btn-task-note" onclick="toggleVoiceInput('task-note-input')" title="音声で入力" aria-label="メモを音声で入力" class="absolute right-2 p-1.5 rounded-xl transition-all opacity-75 hover:opacity-100">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <!-- アクションボタン -->
                <div class="flex items-center gap-3 pt-2">
                    <button type="button" id="delete-task-btn" onclick="confirmDeleteTask()" class="hidden px-4 py-3 rounded-2xl text-sm font-medium text-rose-500 border border-rose-500/30 hover:bg-rose-500/10 transition-colors">
                        削除
                    </button>
                    <button type="submit" id="save-task-btn" class="flex-1 py-3 px-5 rounded-2xl text-sm font-medium text-white shadow-sm transition-all active:scale-[0.98]">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 確認ダイアログ（alert/confirm代替） -->
    <div id="confirm-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/55 backdrop-blur-sm p-4">
        <div id="confirm-modal-card" class="w-full max-w-xs rounded-3xl p-6 shadow-2xl animate-fade-up text-center space-y-4">
            <h3 id="confirm-title" class="font-mincho text-base font-medium">確認</h3>
            <p id="confirm-message" class="text-xs opacity-75 leading-relaxed"></p>
            <div class="flex gap-2.5 pt-2">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 rounded-2xl border text-xs font-medium opacity-80 hover:opacity-100 transition-opacity">キャンセル</button>
                <button id="confirm-ok-btn" class="flex-1 py-2.5 rounded-2xl text-xs font-semibold text-white bg-rose-500 hover:bg-rose-600 transition-colors">実行</button>
            </div>
        </div>
    </div>

    <!-- ホーム画面に追加（PWAインストール）ガイドモーダル -->
    <div id="install-modal" class="fixed inset-0 z-[60] hidden items-end sm:items-center justify-center bg-black/55 backdrop-blur-sm p-0 sm:p-4">
        <div id="install-modal-card" class="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-fade-up space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3.5">
                    <div id="install-icon-preview" class="w-14 h-14 rounded-[16px] overflow-hidden shadow-lg flex-shrink-0 flex items-center justify-center bg-[#12192E] ring-1 ring-white/15">
                    </div>
                    <div>
                        <h3 class="font-mincho text-base font-medium">ホーム画面に追加</h3>
                        <p class="text-[11px] opacity-65">専用アイコンでアプリのように起動できます</p>
                    </div>
                </div>
                <button onclick="closeInstallModal()" class="p-2 rounded-full opacity-60 hover:opacity-100 transition-opacity" aria-label="閉じる">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- ワンタップインストールボタン（Android Chrome等でプロンプト利用可能な場合のみ表示） -->
            <div id="native-install-section" class="hidden">
                <button id="native-install-btn" onclick="triggerNativeInstall()" class="w-full py-3.5 px-5 rounded-2xl text-sm font-medium text-white shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>この端末のホーム画面に追加する</span>
                </button>
            </div>

            <!-- OS別の手順ガイド -->
            <div id="install-guide-steps" class="space-y-3 text-xs leading-relaxed">
                <!-- JSでOSに合わせて描画 -->
            </div>

            <div class="pt-1">
                <button onclick="closeInstallModal()" class="w-full py-2.5 rounded-2xl border text-xs font-medium opacity-80 hover:opacity-100 transition-opacity">閉じる</button>
            </div>
        </div>
    </div>

    <!-- タイマー付きガイドモード（Focus Mode オーバーレイ） -->
    <div id="focus-overlay" class="fixed inset-0 z-50 hidden flex-col justify-between p-6 sm:p-8 transition-colors duration-500 overflow-y-auto">
        <!-- トップバー -->
        <div class="max-w-md w-full mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <span id="focus-badge" class="text-[11px] font-medium px-3 py-1 rounded-full tracking-wide">ガイドモード</span>
                <span id="focus-step-counter" class="font-serif text-sm opacity-65">1 / 5</span>
            </div>
            <button onclick="closeFocusMode()" class="p-2.5 rounded-full opacity-70 hover:opacity-100 transition-opacity" aria-label="ガイドモードを終了">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- 中央タイマー＆現在の項目 -->
        <div class="max-w-md w-full mx-auto flex flex-col items-center text-center my-auto py-6">
            <p id="focus-period-label" class="font-serif italic text-xs tracking-[0.22em] uppercase opacity-55 mb-2">Morning Ritual</p>
            <h2 id="focus-task-title" class="font-mincho text-2xl sm:text-3xl font-medium tracking-wide mb-2 px-2">白湯を飲む</h2>
            <p id="focus-task-note" class="text-xs opacity-65 min-h-[20px] mb-8 px-4"></p>

            <!-- 円形タイマー -->
            <div class="relative w-64 h-64 flex items-center justify-center mb-8">
                <svg class="w-full h-full" viewBox="0 0 220 220">
                    <circle cx="110" cy="110" r="98" fill="none" stroke-width="1" class="opacity-15" stroke="currentColor" stroke-dasharray="3 5" />
                    <circle id="focus-ring-bg" cx="110" cy="110" r="88" fill="none" stroke-width="5" class="opacity-15" stroke="currentColor" />
                    <circle id="focus-ring-progress" cx="110" cy="110" r="88" fill="none" stroke-width="5" stroke-linecap="round" class="progress-ring-circle" stroke-dasharray="552.92" stroke-dashoffset="0" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="focus-timer-display" class="font-serif text-6xl font-light tracking-tight tabular-nums">05:00</span>
                    <span id="focus-timer-status" class="text-[11px] tracking-wider opacity-55 mt-2">タップして開始</span>
                </div>
            </div>

            <!-- タイマーコントロール -->
            <div class="flex items-center justify-center gap-4 mb-6">
                <button onclick="addOneMinuteFocus()" class="px-4 py-2.5 rounded-full border text-xs font-medium opacity-80 hover:opacity-100 transition-all active:scale-95">
                    +1分
                </button>
                <button id="focus-play-btn" onclick="toggleFocusTimer()" class="w-16 h-16 rounded-full flex items-center justify-center text-white shadow-lg transition-transform active:scale-95">
                </button>
                <button onclick="skipFocusTask()" class="px-4 py-2.5 rounded-full border text-xs font-medium opacity-80 hover:opacity-100 transition-all active:scale-95">
                    スキップ
                </button>
            </div>

            <!-- 完了して次へボタン -->
            <button id="focus-complete-btn" onclick="completeCurrentFocusTask()" class="w-full max-w-xs py-3.5 px-6 rounded-full text-sm font-medium text-white shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span>完了して次へ</span>
            </button>
        </div>

        <!-- 次のタスクプレビュー -->
        <div class="max-w-md w-full mx-auto text-center pb-2">
            <div id="focus-next-preview" class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs opacity-75">
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[70] px-5 py-2.5 rounded-full text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300 translate-y-[-8px]">
    </div>

    <script>
        /* ==========================================================================
           定数・状態管理 (State Management)
           ========================================================================== */
        const STORAGE_KEY = 'sora_tsuki_routine_v1';
        const DAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
        const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];

        const MORNING_QUOTES = [
            '静かな朝の積み重ねが、今日という一日に余白を灯します。',
            '完璧でなくても大丈夫。まずは最初のひとつを丁寧に。',
            '深呼吸をして、自分のリズムで今日をはじめましょう。',
            '小さな習慣が、静かにあなたを支える土台になります。'
        ];
        const NIGHT_QUOTES = [
            '今日も一日お疲れさまでした。心と身体をゆっくりほどきましょう。',
            '灯りを落とした静かな時間が、深い眠りへと導きます。',
            'できたことに目を向けて、穏やかに一日を閉じましょう。',
            '明日の自分のために、今夜を優しく整えておきましょう。'
        ];

        // 気分オプション（振り返り＆習慣への愛着形成）
        const MOOD_OPTIONS = [
            { id: 'calm', label: '穏やか', icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12c2-3 5-3 7 0s5 3 7 0 5-3 6 0"/><path d="M2 17c2-3 5-3 7 0s5 3 7 0 5-3 6 0"/></svg>' },
            { id: 'energized', label: '充実', icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/></svg>' },
            { id: 'cozy', label: 'ゆったり', icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>' },
            { id: 'tired', label: 'お疲れ', icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>' }
        ];

        let state = {
            period: 'morning',
            tab: 'today',
            soundEnabled: true,
            routines: [],
            // history[YYYY-MM-DD]: { morning: string[], night: string[], mood?: string, journal?: string, restDay?: boolean }
            history: {},
            routineFilterDay: 'all',
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            selectedCalendarDate: null
        };

        let formState = {
            period: 'morning',
            days: [0, 1, 2, 3, 4, 5, 6]
        };

        let focusState = {
            active: false,
            queue: [],
            currentIndex: 0,
            remainingSec: 0,
            totalSec: 0,
            isRunning: false,
            intervalId: null
        };

        let pendingConfirmAction = null;

        /* ==========================================================================
           ユーティリティ関数
           ========================================================================== */
        function getDateKey(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDisplayDate(date = new Date()) {
            const m = date.getMonth() + 1;
            const d = date.getDate();
            const w = DAY_LABELS[date.getDay()];
            return `${m}月${d}日 (${w})`;
        }

        function formatDaysSummary(days) {
            if (!days || days.length === 0) return '設定なし';
            if (days.length === 7) return '毎日';
            const sorted = [...days].sort((a, b) => a - b);
            if (JSON.stringify(sorted) === JSON.stringify([1, 2, 3, 4, 5])) return '平日';
            if (JSON.stringify(sorted) === JSON.stringify([0, 6])) return '週末';
            return DAY_ORDER.filter(d => days.includes(d)).map(d => DAY_LABELS[d]).join('・');
        }

        function formatMinutes(totalMin) {
            if (totalMin < 60) return `${totalMin}分`;
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return m === 0 ? `${h}時間` : `${h}時間${m}分`;
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function ensureDayRecord(dateKey) {
            if (!state.history[dateKey]) {
                state.history[dateKey] = { morning: [], night: [] };
            }
            if (!Array.isArray(state.history[dateKey].morning)) state.history[dateKey].morning = [];
            if (!Array.isArray(state.history[dateKey].night)) state.history[dateKey].night = [];
            return state.history[dateKey];
        }

        /* ==========================================================================
           サウンド演出 (Tone.js)
           ========================================================================== */
        let synth = null;
        function ensureAudioReady() {
            try {
                if (typeof Tone === 'undefined') return false;
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }
                if (!synth) {
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.03, decay: 0.35, sustain: 0.1, release: 1.4 }
                    }).toDestination();
                    synth.volume.value = -11;
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        function playCheckSound() {
            if (!state.soundEnabled || !ensureAudioReady()) return;
            try {
                const now = Tone.now();
                synth.triggerAttackRelease('E5', '16n', now);
                synth.triggerAttackRelease('B5', '8n', now + 0.07);
            } catch (e) {}
        }

        function playCompleteAllSound() {
            if (!state.soundEnabled || !ensureAudioReady()) return;
            try {
                const now = Tone.now();
                synth.triggerAttackRelease(['C5', 'E5', 'G5'], '4n', now);
                synth.triggerAttackRelease(['D5', 'G5', 'B5', 'D6'], '2n', now + 0.24);
            } catch (e) {}
        }

        function playTimerEndSound() {
            if (!state.soundEnabled || !ensureAudioReady()) return;
            try {
                const now = Tone.now();
                synth.triggerAttackRelease('A4', '4n', now);
                synth.triggerAttackRelease('E5', '2n', now + 0.25);
            } catch (e) {}
        }

        /* ==========================================================================
           データ永続化・初期データ生成
           ========================================================================== */
        function createDefaultData() {
            const routines = [
                { id: 'm1', title: 'カーテンを開けて朝日を浴びる', period: 'morning', duration: 2, days: [0,1,2,3,4,5,6], note: '体内時計をリセット', order: 0 },
                { id: 'm2', title: '白湯を一杯ゆっくり飲む', period: 'morning', duration: 5, days: [0,1,2,3,4,5,6], note: '身体を内側から温める', order: 1 },
                { id: 'm3', title: '軽いストレッチ・深呼吸', period: 'morning', duration: 10, days: [0,1,2,3,4,5,6], note: '肩と背中をほぐす', order: 2 },
                { id: 'm4', title: '今日の予定と優先タスクを確認', period: 'morning', duration: 5, days: [1,2,3,4,5], note: '平日の大切な3つを決める', order: 3 },
                { id: 'm5', title: 'ゆっくりコーヒー・お茶を淹れる', period: 'morning', duration: 15, days: [0,6], note: '休日のご褒美時間', order: 4 },

                { id: 'n1', title: 'スマホを充電スポットに置く', period: 'night', duration: 2, days: [0,1,2,3,4,5,6], note: 'デジタルデトックスの合図', order: 0 },
                { id: 'n2', title: '明日の準備と机のリセット', period: 'night', duration: 5, days: [0,1,2,3,4], note: '翌朝の自分に余白を残す', order: 1 },
                { id: 'n3', title: '温かい飲み物とスキンケア', period: 'night', duration: 10, days: [0,1,2,3,4,5,6], note: '一日の疲れを労わる', order: 2 },
                { id: 'n4', title: '読書または3行日記', period: 'night', duration: 15, days: [0,1,2,3,4,5,6], note: '今日よかったことを思い出す', order: 3 },
                { id: 'n5', title: '湯船に浸かってリラックス', period: 'night', duration: 20, days: [5,6], note: '週末の丁寧なケア', order: 4 }
            ];

            // 過去4日分の豊かなサンプル記録（振り返り＆カレンダーをすぐ体験できるように）
            const history = {};
            const today = new Date();
            const sampleJournals = [
                { mood: 'calm', journal: '朝の白湯と深呼吸のおかげで、午前中ずっと頭が冴えていた。' },
                { mood: 'cozy', journal: '少し疲れていたけれど、スマホを早めに手放して本を読めた。' },
                { mood: 'energized', journal: '朝も夜もリズムよく整えられた一日。' },
                { mood: 'calm', journal: 'ゆっくりストレッチするだけで気持ちが軽くなる。' }
            ];

            for (let offset = 1; offset <= 4; offset++) {
                const d = new Date(today);
                d.setDate(today.getDate() - offset);
                const key = getDateKey(d);
                const dow = d.getDay();
                const morningIds = routines.filter(r => r.period === 'morning' && r.days.includes(dow)).map(r => r.id);
                const nightIds = routines.filter(r => r.period === 'night' && r.days.includes(dow)).map(r => r.id);
                const sample = sampleJournals[offset - 1];
                history[key] = {
                    morning: morningIds,
                    night: offset === 2 ? nightIds.slice(0, Math.max(1, nightIds.length - 1)) : nightIds,
                    mood: sample.mood,
                    journal: sample.journal,
                    restDay: false
                };
            }

            return { routines, history };
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state.routines = Array.isArray(parsed.routines) ? parsed.routines : [];
                    state.history = parsed.history || {};
                    state.soundEnabled = parsed.soundEnabled !== undefined ? parsed.soundEnabled : true;
                } else {
                    const defaults = createDefaultData();
                    state.routines = defaults.routines;
                    state.history = defaults.history;
                    saveState();
                }
            } catch (e) {
                const defaults = createDefaultData();
                state.routines = defaults.routines;
                state.history = defaults.history;
            }

            const hour = new Date().getHours();
            state.period = (hour >= 4 && hour < 16) ? 'morning' : 'night';
            state.selectedCalendarDate = getDateKey(new Date());
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    routines: state.routines,
                    history: state.history,
                    soundEnabled: state.soundEnabled
                }));
            } catch (e) {
                showToast('データの保存に失敗しました');
            }
        }

        /* ==========================================================================
           ロジックヘルパー（達成計算・優しいストリーク・マイルストーン）
           ========================================================================== */
        function getTasksForDate(period, date = new Date()) {
            const dow = date.getDay();
            return state.routines
                .filter(r => r.period === period && r.days.includes(dow))
                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        }

        function getCompletedIds(period, dateKey = getDateKey()) {
            return (state.history[dateKey] && Array.isArray(state.history[dateKey][period]))
                ? state.history[dateKey][period]
                : [];
        }

        function isRestDay(dateKey) {
            return Boolean(state.history[dateKey] && state.history[dateKey].restDay);
        }

        function getCompletionRateForDate(period, date) {
            const tasks = getTasksForDate(period, date);
            if (tasks.length === 0) return null;
            const completed = getCompletedIds(period, getDateKey(date));
            const doneCount = tasks.filter(t => completed.includes(t.id)).length;
            return doneCount / tasks.length;
        }

        function isPeriodFullyCompleted(period, date = new Date()) {
            const tasks = getTasksForDate(period, date);
            if (tasks.length === 0) return false;
            const completed = getCompletedIds(period, getDateKey(date));
            return tasks.every(t => completed.includes(t.id));
        }

        // 「長続きする工夫」: 1つ以上達成（スモールステップ）または「お休み日」で継続の灯火が途切れない優しいストリーク
        function calculateGentleStreak(period) {
            let streak = 0;
            const today = new Date();
            let checkDate = new Date(today);
            const todayKey = getDateKey(checkDate);

            // 今日がまだ未着手かつお休み日でもないなら昨日から数える
            const todayDoneCount = getCompletedIds(period, todayKey).length;
            if (todayDoneCount === 0 && !isRestDay(todayKey)) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            for (let i = 0; i < 365; i++) {
                const key = getDateKey(checkDate);
                if (isRestDay(key)) {
                    // お休み日はカウントを増やさず、連続を途切れさせない
                    checkDate.setDate(checkDate.getDate() - 1);
                    continue;
                }
                const tasks = getTasksForDate(period, checkDate);
                if (tasks.length === 0) {
                    checkDate.setDate(checkDate.getDate() - 1);
                    continue;
                }
                const doneCount = getCompletedIds(period, key).filter(id => tasks.some(t => t.id === id)).length;
                if (doneCount > 0) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        function calculateInsightsStats() {
            const today = new Date();
            let totalCompletedTasks = 0;
            let totalInvestedMinutes = 0;
            let perfectDaysCount = 0;
            let activeDaysTotal = 0;

            const routineMap = new Map(state.routines.map(r => [r.id, r]));

            // 曜日別の達成率集計（過去30日）
            const dowTotals = Array(7).fill(0);
            const dowCompleted = Array(7).fill(0);

            for (let offset = 0; offset < 30; offset++) {
                const d = new Date(today);
                d.setDate(today.getDate() - offset);
                const dow = d.getDay();
                const key = getDateKey(d);
                if (isRestDay(key)) continue;

                ['morning', 'night'].forEach(p => {
                    const tasks = getTasksForDate(p, d);
                    const done = getCompletedIds(p, key).filter(id => tasks.some(t => t.id === id)).length;
                    dowTotals[dow] += tasks.length;
                    dowCompleted[dow] += done;
                });
            }

            // 過去14日間のリズムデータ
            const recent14 = [];
            for (let offset = 13; offset >= 0; offset--) {
                const d = new Date(today);
                d.setDate(today.getDate() - offset);
                const key = getDateKey(d);
                recent14.push({
                    key,
                    dayLabel: DAY_LABELS[d.getDay()],
                    dateNum: d.getDate(),
                    mRate: getCompletionRateForDate('morning', d) || 0,
                    nRate: getCompletionRateForDate('night', d) || 0,
                    rest: isRestDay(key)
                });
            }

            // 全履歴の集計
            const journalEntries = [];
            Object.entries(state.history).forEach(([key, val]) => {
                const mList = Array.isArray(val.morning) ? val.morning : [];
                const nList = Array.isArray(val.night) ? val.night : [];
                totalCompletedTasks += mList.length + nList.length;

                [...mList, ...nList].forEach(id => {
                    const r = routineMap.get(id);
                    totalInvestedMinutes += r ? (Number(r.duration) || 5) : 5;
                });

                if (mList.length > 0 || nList.length > 0) activeDaysTotal++;

                const [y, m, day] = key.split('-').map(Number);
                if (y && m && day) {
                    const dObj = new Date(y, m - 1, day);
                    if (isPeriodFullyCompleted('morning', dObj) && isPeriodFullyCompleted('night', dObj)) {
                        perfectDaysCount++;
                    }
                    if (val.mood || (val.journal && val.journal.trim())) {
                        journalEntries.push({
                            key,
                            dateLabel: `${m}月${day}日 (${DAY_LABELS[dObj.getDay()]})`,
                            mood: val.mood || null,
                            journal: val.journal || ''
                        });
                    }
                }
            });

            journalEntries.sort((a, b) => b.key.localeCompare(a.key));

            const morningStreak = calculateGentleStreak('morning');
            const nightStreak = calculateGentleStreak('night');
            const maxStreak = Math.max(morningStreak, nightStreak);

            // 光のしるし（マイルストーン）
            const milestones = [
                {
                    id: 'first_step',
                    title: 'はじめの一歩',
                    desc: '最初のルーティーンを完了',
                    unlocked: totalCompletedTasks >= 1,
                    svg: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'
                },
                {
                    id: 'three_days',
                    title: '三日月のリズム',
                    desc: '3日以上つづける',
                    unlocked: maxStreak >= 3 || activeDaysTotal >= 3,
                    svg: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'
                },
                {
                    id: 'one_hour',
                    title: '1時間の静寂',
                    desc: '累計60分以上を整える',
                    unlocked: totalInvestedMinutes >= 60,
                    svg: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/>'
                },
                {
                    id: 'harmony',
                    title: '朝と夜の調和',
                    desc: '朝・夜どちらも完全達成',
                    unlocked: perfectDaysCount >= 1,
                    svg: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" opacity="0.25"/>'
                },
                {
                    id: 'seven_days',
                    title: '満ちる一週間',
                    desc: '7日間つづける',
                    unlocked: maxStreak >= 7 || activeDaysTotal >= 7,
                    svg: '<polygon points="12 2 15 9 22 9.5 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9.5 9 9 12 2"/>'
                }
            ];

            return {
                morningStreak,
                nightStreak,
                totalCompletedTasks,
                totalInvestedMinutes,
                perfectDaysCount,
                activeDaysTotal,
                recent14,
                journalEntries: journalEntries.slice(0, 6),
                milestones,
                dowRates: dowTotals.map((tot, i) => tot > 0 ? Math.round((dowCompleted[i] / tot) * 100) : 0)
            };
        }

        /* ==========================================================================
           テーマ＆アンビエント空間適用
           ========================================================================== */
        function getThemeClasses() {
            const isMorning = state.period === 'morning';
            return {
                isMorning,
                bodyBg: isMorning ? 'bg-morning-bg text-morning-text' : 'bg-night-bg text-night-text',
                headerBg: isMorning ? 'bg-morning-bg/70 backdrop-blur-xl' : 'bg-night-bg/70 backdrop-blur-xl',
                card: isMorning ? 'glass-morning' : 'glass-night',
                subtleBg: isMorning ? 'bg-morning-subtle' : 'bg-night-subtle',
                border: isMorning ? 'border-stone-300/60' : 'border-slate-700/60',
                muted: isMorning ? 'text-morning-muted' : 'text-night-muted',
                accentText: isMorning ? 'text-morning-accent' : 'text-night-accent',
                accentBg: isMorning
                    ? 'bg-gradient-to-r from-[#C27135] to-[#D68D4A] hover:brightness-105'
                    : 'bg-gradient-to-r from-[#6D7EF2] to-[#8D9CFF] hover:brightness-110',
                accentSolid: isMorning ? 'bg-morning-accent' : 'bg-indigo-400',
                accentSoft: isMorning ? 'bg-morning-accentSoft text-morning-accent' : 'bg-night-accentSoft text-night-accent',
                accentStroke: isMorning ? '#C8793B' : '#94A6FF',
                input: isMorning
                    ? 'bg-white/80 border-stone-200/90 text-stone-800 focus:ring-amber-500/25 focus:border-amber-600'
                    : 'bg-slate-900/70 border-slate-700/80 text-slate-100 focus:ring-indigo-400/25 focus:border-indigo-400',
                navBg: isMorning ? 'glass-morning' : 'glass-night'
            };
        }

        function applyTheme() {
            const t = getThemeClasses();
            document.body.className = `min-h-screen antialiased relative ${t.bodyBg}`;

            // 背景アンビエントオーブの色を朝・夜で滑らかに変化
            const orbTop = document.getElementById('orb-top');
            const orbBottom = document.getElementById('orb-bottom');
            if (t.isMorning) {
                orbTop.style.background = 'radial-gradient(circle, rgba(242, 188, 128, 0.42) 0%, rgba(246, 242, 235, 0) 70%)';
                orbBottom.style.background = 'radial-gradient(circle, rgba(212, 198, 174, 0.38) 0%, rgba(246, 242, 235, 0) 70%)';
            } else {
                orbTop.style.background = 'radial-gradient(circle, rgba(99, 118, 224, 0.28) 0%, rgba(9, 13, 24, 0) 70%)';
                orbBottom.style.background = 'radial-gradient(circle, rgba(168, 138, 92, 0.16) 0%, rgba(9, 13, 24, 0) 70%)';
            }

            // ヘッダー
            const header = document.getElementById('main-header');
            header.className = `sticky top-0 z-30 px-5 safe-top pb-3 transition-colors duration-500 ${t.headerBg}`;
            document.getElementById('header-greeting').textContent = t.isMorning ? 'Good Morning' : 'Good Evening';
            document.getElementById('header-date').textContent = formatDisplayDate(new Date());

            // ステータスバーのテーマカラーを朝・夜に同期
            const themeColorMeta = document.getElementById('meta-theme-color');
            if (themeColorMeta) {
                themeColorMeta.setAttribute('content', t.isMorning ? '#F6F2EB' : '#090D18');
            }

            // ホーム画面追加ボタンのスタイル（スタンドアロン起動中なら非表示）
            const installBtn = document.getElementById('install-app-btn');
            if (installBtn) {
                if (isStandaloneMode()) {
                    installBtn.classList.add('hidden');
                } else {
                    installBtn.className = `p-2.5 rounded-full transition-all duration-200 ${t.subtleBg} ${t.muted} hover:opacity-100`;
                }
            }

            // 朝・夜スイッチャー
            const switcher = document.getElementById('period-switcher');
            switcher.className = `flex p-1 rounded-full border transition-all duration-300 ${t.subtleBg} ${t.border}`;

            const btnMorning = document.getElementById('btn-period-morning');
            const btnNight = document.getElementById('btn-period-night');
            if (t.isMorning) {
                btnMorning.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-morning-accent shadow-sm transition-all duration-300';
                btnNight.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium text-morning-muted hover:text-morning-text transition-all duration-300';
            } else {
                btnMorning.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium text-night-muted hover:text-night-text transition-all duration-300';
                btnNight.className = 'flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-700/80 text-indigo-200 shadow-sm transition-all duration-300';
            }

            // サウンドボタン
            const soundBtn = document.getElementById('sound-toggle-btn');
            soundBtn.className = `p-2.5 rounded-full transition-all duration-200 ${t.subtleBg} ${t.muted} hover:opacity-100`;
            soundBtn.innerHTML = state.soundEnabled
                ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`
                : `<svg class="w-4 h-4 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

            // ボトムナビ
            const nav = document.getElementById('bottom-nav');
            nav.className = `max-w-md mx-auto rounded-full px-2 py-1.5 pointer-events-auto transition-all duration-500 ${t.navBg}`;

            ['today', 'routines', 'insights'].forEach(tabId => {
                const el = document.getElementById(`nav-${tabId}`);
                if (state.tab === tabId) {
                    el.className = `flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-full transition-all duration-300 text-white shadow-sm ${t.accentBg}`;
                } else {
                    el.className = `flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-full transition-all duration-300 ${t.muted} hover:opacity-100`;
                }
            });
        }

        /* ==========================================================================
           クリエイティブSVGアートワーク：進捗で昇る太陽 / 満ちる月
           ========================================================================== */
        function renderCelestialArtwork(progress, isMorning) {
            // 太陽は progress 0→1 で y=74 から y=34 へ上昇し、光輪が広がる
            if (isMorning) {
                const sunY = 72 - progress * 36;
                const haloR = 20 + progress * 18;
                const haloOpacity = 0.14 + progress * 0.28;
                return `
                    <svg class="w-24 h-24 flex-shrink-0" viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#E59A4E" stop-opacity="0.7"/>
                                <stop offset="100%" stop-color="#E59A4E" stop-opacity="0"/>
                            </radialGradient>
                            <clipPath id="horizonClip">
                                <rect x="0" y="0" width="100" height="74" rx="16"/>
                            </clipPath>
                        </defs>
                        <!-- 外枠の繊細な円弧 -->
                        <circle cx="50" cy="50" r="46" fill="none" stroke="#C8793B" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 4"/>
                        <!-- 進捗リング -->
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#C8793B" stroke-opacity="0.12" stroke-width="2.5"/>
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#C8793B" stroke-width="2.5" stroke-linecap="round"
                            class="progress-ring-circle" stroke-dasharray="263.89" stroke-dashoffset="${263.89 * (1 - progress)}"/>
                        <!-- 地平線より上に昇る太陽 -->
                        <g clip-path="url(#horizonClip)">
                            <circle cx="50" cy="${sunY}" r="${haloR}" fill="url(#sunGlow)" opacity="${haloOpacity}" class="celestial-transition"/>
                            <circle cx="50" cy="${sunY}" r="14" fill="#D58640" class="celestial-transition"/>
                        </g>
                        <!-- 地平線 -->
                        <line x1="20" y1="74" x2="80" y2="74" stroke="#B68E68" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
                        <text x="50" y="88" text-anchor="middle" font-size="10" fill="#787067" class="font-serif">${Math.round(progress * 100)}%</text>
                    </svg>
                `;
            } else {
                // 夜は progress 0→1 で三日月が満月へと満ちていく
                const shadowOffset = 10 + progress * 24;
                const glowOpacity = 0.15 + progress * 0.35;
                return `
                    <svg class="w-24 h-24 flex-shrink-0" viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#DFC58E" stop-opacity="0.55"/>
                                <stop offset="100%" stop-color="#90A2FF" stop-opacity="0"/>
                            </radialGradient>
                            <mask id="moonPhaseMask">
                                <rect x="0" y="0" width="100" height="100" fill="black"/>
                                <circle cx="50" cy="46" r="16" fill="white"/>
                                <circle cx="${50 + shadowOffset}" cy="42" r="15" fill="black" class="celestial-transition"/>
                            </mask>
                        </defs>
                        <circle cx="50" cy="50" r="46" fill="none" stroke="#90A2FF" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 4"/>
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#90A2FF" stroke-opacity="0.14" stroke-width="2.5"/>
                        <circle cx="50" cy="50" r="42" fill="none" stroke="#90A2FF" stroke-width="2.5" stroke-linecap="round"
                            class="progress-ring-circle" stroke-dasharray="263.89" stroke-dashoffset="${263.89 * (1 - progress)}"/>
                        <!-- 星々 -->
                        <circle cx="28" cy="34" r="1.2" fill="#DFC58E" class="star-twinkle"/>
                        <circle cx="72" cy="30" r="1.4" fill="#C7D2FE" class="star-twinkle" style="animation-delay: 1.1s"/>
                        <circle cx="68" cy="62" r="1" fill="#DFC58E" class="star-twinkle" style="animation-delay: 2.1s"/>
                        <!-- 月光と満ち欠け -->
                        <circle cx="50" cy="46" r="28" fill="url(#moonGlow)" opacity="${glowOpacity}" class="celestial-transition"/>
                        <circle cx="50" cy="46" r="16" fill="#E8D3A2" mask="url(#moonPhaseMask)"/>
                        <text x="50" y="84" text-anchor="middle" font-size="10" fill="#8E9BB5" class="font-serif">${Math.round(progress * 100)}%</text>
                    </svg>
                `;
            }
        }

        /* ==========================================================================
           描画エンジン (Render Views)
           ========================================================================== */
        function render() {
            applyTheme();
            const main = document.getElementById('main-content');
            if (state.tab === 'today') {
                main.innerHTML = renderTodayView();
            } else if (state.tab === 'routines') {
                main.innerHTML = renderRoutinesView();
            } else if (state.tab === 'insights') {
                main.innerHTML = renderInsightsView();
            }
        }

        // 1. 「今日」タブ
        function renderTodayView() {
            const t = getThemeClasses();
            const today = new Date();
            const todayKey = getDateKey(today);
            const tasks = getTasksForDate(state.period, today);
            const completedIds = getCompletedIds(state.period, todayKey);
            const completedCount = tasks.filter(task => completedIds.includes(task.id)).length;
            const totalCount = tasks.length;
            const progress = totalCount > 0 ? completedCount / totalCount : 0;
            const totalDuration = tasks.reduce((sum, task) => sum + (Number(task.duration) || 0), 0);
            const remainingDuration = tasks
                .filter(task => !completedIds.includes(task.id))
                .reduce((sum, task) => sum + (Number(task.duration) || 0), 0);

            const streak = calculateGentleStreak(state.period);
            const quotes = t.isMorning ? MORNING_QUOTES : NIGHT_QUOTES;
            const dailyQuote = quotes[today.getDate() % quotes.length];
            const isAllDone = totalCount > 0 && completedCount === totalCount;
            const todayRec = state.history[todayKey] || {};
            const todayRest = Boolean(todayRec.restDay);

            return `
                <div class="space-y-5 animate-fade-up">
                    <!-- ヒーロー天体サマリーカード -->
                    <section class="rounded-[28px] p-5 sm:p-6 ${t.card} relative overflow-hidden">
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-2 flex-wrap">
                                    <span class="text-[11px] font-medium px-2.5 py-1 rounded-full tracking-wide ${t.accentSoft}">
                                        ${t.isMorning ? '朝の整え' : '夜のほどき'}
                                    </span>
                                    ${streak > 0 ? `
                                        <span class="inline-flex items-center gap-1 text-[11px] font-medium px-2.5 py-1 rounded-full ${t.subtleBg}">
                                            <span class="w-1.5 h-1.5 rounded-full ${t.accentSolid}"></span>
                                            <span>${streak}日継続中</span>
                                        </span>
                                    ` : ''}
                                </div>
                                <h2 class="font-mincho text-xl font-medium tracking-wide leading-snug">
                                    ${todayRest
                                        ? '今日はゆっくり休む日'
                                        : isAllDone
                                            ? (t.isMorning ? '朝の光が整いました' : '静かな夜が満ちました')
                                            : totalCount === 0
                                                ? '今日の予定はありません'
                                                : `あと ${totalCount - completedCount} 項目`
                                    }
                                </h2>
                                <p class="text-xs ${t.muted} mt-1.5 leading-relaxed">${dailyQuote}</p>
                            </div>

                            <!-- 動的SVG天体アート -->
                            ${renderCelestialArtwork(progress, t.isMorning)}
                        </div>

                        <!-- アクションバー -->
                        ${totalCount > 0 ? `
                            <div class="mt-4 pt-4 border-t ${t.border} flex items-center justify-between gap-3">
                                <div class="flex items-center gap-1.5 text-xs ${t.muted}">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    <span>${isAllDone ? `合計 ${formatMinutes(totalDuration)} 完了` : `残り目安 ${formatMinutes(remainingDuration)}`}</span>
                                </div>
                                ${!isAllDone ? `
                                    <button onclick="startFocusMode()" class="px-4 py-2 rounded-full text-xs font-medium text-white shadow-sm transition-all active:scale-[0.97] flex items-center gap-1.5 ${t.accentBg}">
                                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                        <span>ガイド開始</span>
                                    </button>
                                ` : `
                                    <span class="text-xs font-medium ${t.accentText} flex items-center gap-1">
                                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                        すべて完了
                                    </span>
                                `}
                            </div>
                        ` : ''}
                    </section>

                    <!-- チェックリストセクション -->
                    <section class="space-y-2.5">
                        <div class="flex items-center justify-between px-1">
                            <div class="flex items-center gap-2">
                                <h3 class="text-xs font-medium tracking-wider ${t.muted}">
                                    ${DAY_LABELS[today.getDay()]}曜日のリスト
                                </h3>
                                <span class="font-serif text-xs ${t.muted}">${completedCount} / ${totalCount}</span>
                            </div>
                            <button onclick="openTaskModal(null)" class="text-xs font-medium ${t.accentText} hover:opacity-80 flex items-center gap-1 transition-opacity">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                <span>追加</span>
                            </button>
                        </div>

                        ${totalCount === 0 ? `
                            <div class="rounded-3xl p-8 text-center ${t.card} space-y-3">
                                <p class="text-sm ${t.muted}">この曜日の${t.isMorning ? '朝' : '夜'}のルーティーンはまだありません。</p>
                                <button onclick="openTaskModal(null)" class="px-5 py-2.5 rounded-full text-xs font-medium text-white ${t.accentBg}">
                                    最初の項目を追加する
                                </button>
                            </div>
                        ` : `
                            <div class="space-y-2.5">
                                ${tasks.map(task => {
                                    const done = completedIds.includes(task.id);
                                    return `
                                        <div class="group rounded-2xl p-4 flex items-center gap-3.5 transition-all duration-300 ${t.card} ${done ? 'opacity-60' : ''}">
                                            <!-- チェックボタン -->
                                            <button onclick="toggleTaskCompletion('${task.id}')" class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 border-[1.5px] transition-all duration-200 ${done ? `${t.accentBg} border-transparent text-white animate-check` : `${t.border} hover:border-current`}" aria-label="${escapeHtml(task.title)}を完了にする">
                                                ${done ? `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
                                            </button>

                                            <!-- テキスト情報 -->
                                            <div onclick="toggleTaskCompletion('${task.id}')" class="flex-1 min-w-0 cursor-pointer select-none">
                                                <div class="text-sm font-medium truncate transition-all ${done ? 'line-through opacity-70' : ''}">${escapeHtml(task.title)}</div>
                                                <div class="flex items-center gap-2 mt-1 text-[11px] ${t.muted}">
                                                    <span class="inline-flex items-center gap-1 font-serif text-xs">
                                                        ${task.duration} min
                                                    </span>
                                                    ${task.note ? `<span class="truncate opacity-80">· ${escapeHtml(task.note)}</span>` : ''}
                                                </div>
                                            </div>

                                            <!-- 個別タイマー開始 -->
                                            ${!done ? `
                                                <button onclick="startFocusMode('${task.id}')" title="この項目からタイマーを開始" class="p-2 rounded-full ${t.subtleBg} ${t.muted} hover:opacity-100 transition-all flex-shrink-0" aria-label="タイマー開始">
                                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                                </button>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </section>

                    <!-- 今日の気分＆ちいさな振り返り（習慣に愛着を生む仕組み） -->
                    <section class="rounded-[24px] p-5 ${t.card} space-y-3.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-medium tracking-wide ${t.muted}">今日の気分とひとこと</span>
                            <div class="flex items-center gap-2.5">
                                ${(todayRec.mood || (todayRec.journal && todayRec.journal.trim())) ? `
                                    <button onclick="clearDayJournalAndMood('${todayKey}')" class="text-[11px] text-rose-500/80 hover:text-rose-500 transition-colors">消去</button>
                                ` : ''}
                                <span id="voice-status-today-journal" class="text-[11px] ${todayRec.mood ? t.accentText : 'opacity-45'}">${todayRec.mood ? '記録済み' : '音声入力対応'}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            ${MOOD_OPTIONS.map(m => {
                                const selected = todayRec.mood === m.id;
                                return `
                                    <button onclick="setDayMood('${todayKey}', '${m.id}')" class="py-2.5 px-1 rounded-2xl border flex flex-col items-center gap-1 text-[11px] transition-all ${selected ? `${t.accentSoft} border-current font-medium` : `${t.border} ${t.muted} hover:opacity-100`}">
                                        ${m.icon}
                                        <span>${m.label}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="relative flex-1 flex items-center">
                                <input type="text" id="today-journal-input" value="${escapeHtml(todayRec.journal || '')}" maxlength="80" placeholder="今日の小さな気づきを残す…" class="w-full pl-3.5 pr-10 py-2.5 rounded-xl border text-xs focus:outline-none focus:ring-2 transition-all ${t.input}">
                                <button type="button" id="voice-btn-today-journal" onclick="toggleVoiceInput('today-journal-input', { autoSaveJournalDate: '${todayKey}' })" title="音声で入力" aria-label="今日のひとことを音声で入力" class="absolute right-1.5 p-1.5 rounded-lg transition-all ${t.muted} hover:opacity-100">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                                </button>
                            </div>
                            <button onclick="saveDayJournal('${todayKey}', 'today-journal-input')" class="px-3.5 py-2.5 rounded-xl text-xs font-medium ${t.subtleBg} hover:opacity-100 transition-opacity flex-shrink-0">保存</button>
                        </div>
                    </section>
                </div>
            `;
        }

        // 2. 「設定・曜日」タブ
        function renderRoutinesView() {
            const t = getThemeClasses();
            const periodRoutines = state.routines
                .filter(r => r.period === state.period)
                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

            const filtered = state.routineFilterDay === 'all'
                ? periodRoutines
                : periodRoutines.filter(r => r.days.includes(Number(state.routineFilterDay)));

            const totalDuration = filtered.reduce((s, r) => s + (Number(r.duration) || 0), 0);

            return `
                <div class="space-y-5 animate-fade-up">
                    <!-- ヘッダー -->
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="font-mincho text-lg font-medium">${t.isMorning ? '朝' : '夜'}のルーティーン設計</h2>
                            <p class="text-xs ${t.muted} mt-0.5">曜日ごとのリズムと所要時間を整えます</p>
                        </div>
                        <button onclick="openTaskModal(null)" class="px-4 py-2.5 rounded-full text-xs font-medium text-white shadow-sm transition-all active:scale-95 flex items-center gap-1.5 ${t.accentBg}">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            <span>追加</span>
                        </button>
                    </div>

                    <!-- 曜日フィルター -->
                    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                        <button onclick="setRoutineFilter('all')" class="px-3.5 py-2 rounded-full text-xs font-medium flex-shrink-0 transition-all ${state.routineFilterDay === 'all' ? `${t.accentBg} text-white shadow-sm` : `${t.card} ${t.muted}`}">
                            すべて
                        </button>
                        ${DAY_ORDER.map(dayIdx => {
                            const active = state.routineFilterDay === String(dayIdx);
                            return `
                                <button onclick="setRoutineFilter('${dayIdx}')" class="w-9 h-9 rounded-full text-xs font-medium flex-shrink-0 transition-all flex items-center justify-center ${active ? `${t.accentBg} text-white shadow-sm` : `${t.card} ${t.muted}`}">
                                    ${DAY_LABELS[dayIdx]}
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- 合計時間バー -->
                    <div class="flex items-center justify-between px-1 text-xs ${t.muted}">
                        <span>${state.routineFilterDay === 'all' ? '登録項目' : `${DAY_LABELS[Number(state.routineFilterDay)]}曜日の項目`} · ${filtered.length}件</span>
                        <span>合計目安 <strong class="font-medium opacity-95">${formatMinutes(totalDuration)}</strong></span>
                    </div>

                    <!-- リスト -->
                    ${filtered.length === 0 ? `
                        <div class="rounded-3xl p-8 text-center ${t.card}">
                            <p class="text-sm ${t.muted}">該当するルーティーンがありません。</p>
                        </div>
                    ` : `
                        <div class="space-y-2.5">
                            ${filtered.map((task, idx) => `
                                <div class="rounded-2xl p-4 flex items-center gap-3 ${t.card}">
                                    ${state.routineFilterDay === 'all' ? `
                                        <div class="flex flex-col gap-0.5 flex-shrink-0">
                                            <button onclick="moveRoutine('${task.id}', -1)" ${idx === 0 ? 'disabled' : ''} class="p-1 rounded-md ${idx === 0 ? 'opacity-20 cursor-not-allowed' : `${t.muted} hover:opacity-100`}" aria-label="上へ移動">
                                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                                            </button>
                                            <button onclick="moveRoutine('${task.id}', 1)" ${idx === filtered.length - 1 ? 'disabled' : ''} class="p-1 rounded-md ${idx === filtered.length - 1 ? 'opacity-20 cursor-not-allowed' : `${t.muted} hover:opacity-100`}" aria-label="下へ移動">
                                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                                            </button>
                                        </div>
                                    ` : ''}

                                    <div onclick="openTaskModal('${task.id}')" class="flex-1 min-w-0 cursor-pointer">
                                        <div class="text-sm font-medium truncate">${escapeHtml(task.title)}</div>
                                        <div class="flex items-center flex-wrap gap-2 mt-1.5">
                                            <span class="text-[11px] px-2.5 py-0.5 rounded-full font-medium ${t.accentSoft}">${task.duration}分</span>
                                            <span class="text-[11px] px-2.5 py-0.5 rounded-full ${t.subtleBg} ${t.muted}">${formatDaysSummary(task.days)}</span>
                                        </div>
