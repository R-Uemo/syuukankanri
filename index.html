                                    </div>

                                    <div class="flex items-center gap-1.5 flex-shrink-0">
                                        <button onclick="openTaskModal('${task.id}')" class="p-2.5 rounded-full ${t.subtleBg} ${t.muted} hover:opacity-100 transition-opacity" aria-label="編集" title="編集">
                                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                        </button>
                                        <button onclick="deleteRoutineDirect('${task.id}')" class="p-2.5 rounded-full ${t.subtleBg} text-rose-500/80 hover:text-rose-500 hover:bg-rose-500/10 transition-colors" aria-label="削除" title="削除">
                                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}

                    ${periodRoutines.length > 0 ? `
                        <div class="pt-2 flex justify-center">
                            <button onclick="confirmClearPeriodRoutines()" class="text-xs text-rose-500/80 hover:text-rose-500 underline underline-offset-4 transition-colors">
                                ${t.isMorning ? '朝' : '夜'}のルーティーン項目をすべて削除
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 3. 「記録」タブ（クリエイティブデザイン＆長続きする工夫を凝縮）
        function renderInsightsView() {
            const t = getThemeClasses();
            const stats = calculateInsightsStats();
            const year = state.calendarYear;
            const month = state.calendarMonth;

            const firstDayOfMonth = new Date(year, month, 1);
            const lastDayOfMonth = new Date(year, month + 1, 0);
            const startPad = firstDayOfMonth.getDay();
            const daysInMonth = lastDayOfMonth.getDate();
            const todayKey = getDateKey(new Date());

            // 天体カレンダーセル生成
            let calendarCells = '';
            for (let i = 0; i < startPad; i++) {
                calendarCells += `<div class="h-12"></div>`;
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const dObj = new Date(year, month, day);
                const key = getDateKey(dObj);
                const mRate = getCompletionRateForDate('morning', dObj) || 0;
                const nRate = getCompletionRateForDate('night', dObj) || 0;
                const rest = isRestDay(key);
                const isToday = key === todayKey;
                const isSelected = key === state.selectedCalendarDate;
                const isPerfect = mRate === 1 && nRate === 1;

                // 朝（琥珀色）と夜（月光色）の半円アーク表現
                const mOpacity = mRate === 1 ? 1 : (mRate > 0 ? 0.45 : 0);
                const nOpacity = nRate === 1 ? 1 : (nRate > 0 ? 0.45 : 0);

                calendarCells += `
                    <button onclick="selectCalendarDate('${key}')" class="relative h-12 rounded-2xl flex flex-col items-center justify-center transition-all ${isSelected ? `${t.accentSoft} ring-1 ring-current` : (isToday ? `${t.subtleBg}` : 'hover:opacity-80')}">
                        <div class="relative w-8 h-8 flex items-center justify-center">
                            <svg class="w-8 h-8 absolute inset-0" viewBox="0 0 36 36">
                                ${rest ? `
                                    <circle cx="18" cy="18" r="14" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 3"/>
                                ` : `
                                    ${mOpacity > 0 ? `<path d="M 18 4 A 14 14 0 0 1 18 32" fill="none" stroke="#D98A3C" stroke-width="${isPerfect ? 2.4 : 2}" stroke-linecap="round" stroke-opacity="${mOpacity}"/>` : ''}
                                    ${nOpacity > 0 ? `<path d="M 18 32 A 14 14 0 0 1 18 4" fill="none" stroke="#8E9FFF" stroke-width="${isPerfect ? 2.4 : 2}" stroke-linecap="round" stroke-opacity="${nOpacity}"/>` : ''}
                                `}
                            </svg>
                            <span class="text-xs tabular-nums ${isToday || isSelected ? 'font-semibold' : 'opacity-85'}">${day}</span>
                        </div>
                        ${rest ? `<span class="text-[8px] opacity-60 leading-none">休</span>` : `<span class="h-1"></span>`}
                    </button>
                `;
            }

            // 選択日の詳細ジャーナル＆お休みパス切替
            let selectedDetailHtml = '';
            if (state.selectedCalendarDate) {
                const key = state.selectedCalendarDate;
                const [sy, sm, sd] = key.split('-').map(Number);
                const sDate = new Date(sy, sm - 1, sd);
                const mTasks = getTasksForDate('morning', sDate);
                const nTasks = getTasksForDate('night', sDate);
                const mDone = getCompletedIds('morning', key).filter(id => mTasks.some(tk => tk.id === id)).length;
                const nDone = getCompletedIds('night', key).filter(id => nTasks.some(tk => tk.id === id)).length;
                const rec = state.history[key] || {};
                const rest = Boolean(rec.restDay);
                const moodObj = MOOD_OPTIONS.find(m => m.id === rec.mood);

                selectedDetailHtml = `
                    <div class="mt-4 pt-4 border-t ${t.border} space-y-3">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <div class="flex items-center gap-2">
                                <span class="font-mincho text-sm font-medium">${sm}月${sd}日 (${DAY_LABELS[sDate.getDay()]})</span>
                                ${moodObj ? `<span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full ${t.subtleBg} ${t.muted}">${moodObj.label}</span>` : ''}
                            </div>
                            <div class="flex items-center gap-3 text-xs">
                                <span class="inline-flex items-center gap-1.5">
                                    <span class="w-2 h-2 rounded-full bg-[#D98A3C]"></span>朝 ${mDone}/${mTasks.length}
                                </span>
                                <span class="inline-flex items-center gap-1.5">
                                    <span class="w-2 h-2 rounded-full bg-[#8E9FFF]"></span>夜 ${nDone}/${nTasks.length}
                                </span>
                            </div>
                        </div>

                        ${rec.journal ? `
                            <p class="text-xs leading-relaxed px-3.5 py-2.5 rounded-xl ${t.subtleBg} opacity-90">「${escapeHtml(rec.journal)}」</p>
                        ` : ''}

                        <!-- 長続きの工夫：お休みパス（連続記録を守る） -->
                        <div class="flex items-center justify-between gap-2 pt-1">
                            <span class="text-[11px] ${t.muted}">疲れた日は「お休み日」にすると連続記録が守られます</span>
                            <button onclick="toggleRestDay('${key}')" class="px-3 py-1.5 rounded-full text-[11px] font-medium border transition-all flex-shrink-0 ${rest ? `${t.accentSoft} border-current` : `${t.border} ${t.muted} hover:opacity-100`}">
                                ${rest ? 'お休み日 解除' : 'お休み日にする'}
                            </button>
                        </div>

                        ${(mDone > 0 || nDone > 0 || rec.mood || rec.journal || rest) ? `
                            <div class="pt-2 flex justify-end">
                                <button onclick="confirmClearDayRecord('${key}')" class="text-[11px] text-rose-500/80 hover:text-rose-500 transition-colors">
                                    この日の記録を消去する
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            return `
                <div class="space-y-5 animate-fade-up">
                    <!-- 1. 自分のために整えた時間 ヒーローカード -->
                    <section class="rounded-[28px] p-6 ${t.card} relative overflow-hidden">
                        <div class="flex items-start justify-between gap-4">
                            <div>
                                <p class="font-serif italic text-xs tracking-[0.18em] uppercase ${t.muted}">Time Invested in Yourself</p>
                                <h2 class="font-mincho text-sm mt-1 opacity-80">これまでに自分を整えた時間</h2>
                                <div class="font-serif text-4xl sm:text-5xl font-medium tracking-tight mt-2 tabular-nums">
                                    ${formatMinutes(stats.totalInvestedMinutes)}
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="inline-block text-[11px] px-2.5 py-1 rounded-full ${t.accentSoft}">
                                    累計 ${stats.totalCompletedTasks} 行動
                                </span>
                            </div>
                        </div>

                        <!-- 優しい継続リズム（朝・夜） -->
                        <div class="grid grid-cols-2 gap-3 mt-5 pt-4 border-t ${t.border}">
                            <div class="flex items-center justify-between px-3.5 py-2.5 rounded-2xl ${t.subtleBg}">
                                <div>
                                    <div class="flex items-center gap-1.5 text-[11px] ${t.muted}">
                                        <span class="w-2 h-2 rounded-full bg-[#D98A3C]"></span>
                                        <span>朝の継続</span>
                                    </div>
                                    <div class="font-serif text-2xl font-medium mt-0.5 tabular-nums">${stats.morningStreak}<span class="font-sans text-xs ml-1 opacity-65">日</span></div>
                                </div>
                            </div>
                            <div class="flex items-center justify-between px-3.5 py-2.5 rounded-2xl ${t.subtleBg}">
                                <div>
                                    <div class="flex items-center gap-1.5 text-[11px] ${t.muted}">
                                        <span class="w-2 h-2 rounded-full bg-[#8E9FFF]"></span>
                                        <span>夜の継続</span>
                                    </div>
                                    <div class="font-serif text-2xl font-medium mt-0.5 tabular-nums">${stats.nightStreak}<span class="font-sans text-xs ml-1 opacity-65">日</span></div>
                                </div>
                            </div>
                        </div>
                        <p class="text-[11px] ${t.muted} mt-3 opacity-80">
                            ※ 1項目だけの「小さな一歩」やお休み日でも、あなたの継続リズムは途切れません。
                        </p>
                    </section>

                    <!-- 2. 天体カレンダー -->
                    <section class="rounded-[28px] p-5 ${t.card}">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h3 class="font-serif text-lg font-medium tracking-wide">${year} . ${String(month + 1).padStart(2, '0')}</h3>
                                <p class="text-[11px] ${t.muted}">右弧が朝、左弧が夜の達成を表します</p>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-full ${t.subtleBg} ${t.muted} hover:opacity-100" aria-label="前月">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="15 18 9 12 15 6"/></svg>
                                </button>
                                <button onclick="changeCalendarMonth(1)" class="p-2 rounded-full ${t.subtleBg} ${t.muted} hover:opacity-100" aria-label="次月">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="9 18 15 12 9 6"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-7 gap-1 text-center text-[11px] ${t.muted} mb-2">
                            ${DAY_LABELS.map(l => `<div>${l}</div>`).join('')}
                        </div>

                        <div class="grid grid-cols-7 gap-1">
                            ${calendarCells}
                        </div>

                        ${selectedDetailHtml}
                    </section>

                    <!-- 3. 光のしるし（マイルストーンバッジ） -->
                    <section class="rounded-[28px] p-5 ${t.card}">
                        <div class="flex items-center justify-between mb-3.5">
                            <h3 class="font-mincho text-sm font-medium">光のしるし</h3>
                            <span class="text-[11px] ${t.muted}">${stats.milestones.filter(m => m.unlocked).length} / ${stats.milestones.length} 獲得</span>
                        </div>
                        <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
                            ${stats.milestones.map(m => `
                                <div class="w-32 flex-shrink-0 rounded-2xl p-3.5 border transition-all ${m.unlocked ? `${t.accentSoft} border-current/20` : `${t.subtleBg} border-transparent opacity-50`}">
                                    <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2.5 ${m.unlocked ? `${t.accentBg} text-white shadow-sm` : `border ${t.border}`}">
                                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${m.svg}</svg>
                                    </div>
                                    <div class="text-xs font-medium leading-tight">${m.title}</div>
                                    <div class="text-[10px] opacity-70 mt-1 leading-snug">${m.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- 4. 直近14日間の朝夜リズム & 曜日バランス -->
                    <section class="rounded-[28px] p-5 ${t.card} space-y-5">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-mincho text-sm font-medium">14日間の朝夜リズム</h3>
                                <div class="flex items-center gap-2.5 text-[10px] ${t.muted}">
                                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#D98A3C]"></span>朝</span>
                                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#8E9FFF]"></span>夜</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-14 gap-1 items-end h-20" style="grid-template-columns: repeat(14, minmax(0, 1fr));">
                                ${stats.recent14.map(d => `
                                    <div class="flex flex-col items-center gap-1 h-full justify-end">
                                        <div class="w-full flex flex-col gap-0.5 justify-end h-14">
                                            ${d.rest
                                                ? `<div class="w-full h-3 rounded-full border border-dashed border-current opacity-35"></div>`
                                                : `
                                                    <div class="w-full rounded-full bg-[#D98A3C] transition-all" style="height: ${Math.max(d.mRate > 0 ? 4 : 0, Math.round(d.mRate * 24))}px; opacity: ${d.mRate > 0 ? 0.9 : 0.1}"></div>
                                                    <div class="w-full rounded-full bg-[#8E9FFF] transition-all" style="height: ${Math.max(d.nRate > 0 ? 4 : 0, Math.round(d.nRate * 24))}px; opacity: ${d.nRate > 0 ? 0.9 : 0.1}"></div>
                                                `
                                            }
                                        </div>
                                        <span class="text-[9px] ${t.muted} tabular-nums">${d.dateNum}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="pt-4 border-t ${t.border}">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-mincho text-sm font-medium">曜日ごとの達成バランス</h3>
                                <span class="text-[11px] ${t.muted}">過去30日</span>
                            </div>
                            <div class="grid grid-cols-7 gap-2 items-end h-24 pt-1">
                                ${DAY_ORDER.map(dayIdx => {
                                    const rate = stats.dowRates[dayIdx];
                                    return `
                                        <div class="flex flex-col items-center gap-1.5 h-full justify-end">
                                            <span class="font-serif text-[11px] ${t.muted} tabular-nums">${rate}%</span>
                                            <div class="w-3.5 h-12 rounded-full ${t.subtleBg} flex items-end overflow-hidden">
                                                <div class="w-full rounded-full transition-all duration-500 ${t.accentBg}" style="height: ${Math.max(8, rate)}%"></div>
                                            </div>
                                            <span class="text-[11px] ${t.muted}">${DAY_LABELS[dayIdx]}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </section>

                    <!-- 5. ちいさな振り返りタイムライン -->
                    ${stats.journalEntries.length > 0 ? `
                        <section class="rounded-[28px] p-5 ${t.card} space-y-3">
                            <h3 class="font-mincho text-sm font-medium">最近の振り返り</h3>
                            <div class="space-y-2.5">
                                ${stats.journalEntries.map(entry => {
                                    const moodObj = MOOD_OPTIONS.find(m => m.id === entry.mood);
                                    return `
                                        <div class="p-3.5 rounded-2xl ${t.subtleBg} space-y-1">
                                            <div class="flex items-center justify-between text-[11px] ${t.muted}">
                                                <span>${entry.dateLabel}</span>
                                                ${moodObj ? `<span class="inline-flex items-center gap-1">${moodObj.icon} ${moodObj.label}</span>` : ''}
                                            </div>
                                            ${entry.journal ? `<p class="text-xs leading-relaxed">${escapeHtml(entry.journal)}</p>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </section>
                    ` : ''}

                    <!-- データ管理（テストデータの完全消去 / サンプル復元） -->
                    <section class="rounded-[24px] p-4 ${t.card} flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
                        <span class="${t.muted}">データ管理</span>
                        <div class="flex items-center gap-2 flex-wrap justify-center">
                            <button onclick="confirmClearAllData()" class="px-3.5 py-2 rounded-full border border-rose-500/30 text-rose-500 hover:bg-rose-500/10 transition-colors font-medium">
                                すべてのデータを消去
                            </button>
                            <button onclick="confirmResetApp()" class="px-3.5 py-2 rounded-full ${t.subtleBg} ${t.muted} hover:opacity-100 transition-opacity">
                                サンプルに戻す
                            </button>
                        </div>
                    </section>
                </div>
            `;
        }

        /* ==========================================================================
           ユーザーアクションハンドラ
           ========================================================================== */
        function setPeriod(period) {
            stopVoiceInput();
            state.period = period;
            render();
        }

        function setTab(tab) {
            stopVoiceInput();
            state.tab = tab;
            render();
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            saveState();
            applyTheme();
            showToast(state.soundEnabled ? '効果音をオンにしました' : '効果音をオフにしました');
            if (state.soundEnabled) playCheckSound();
        }

        function setRoutineFilter(val) {
            state.routineFilterDay = val;
            render();
        }

        function selectCalendarDate(dateKey) {
            state.selectedCalendarDate = dateKey;
            render();
        }

        function changeCalendarMonth(delta) {
            let m = state.calendarMonth + delta;
            let y = state.calendarYear;
            if (m < 0) { m = 11; y--; }
            if (m > 11) { m = 0; y++; }
            state.calendarMonth = m;
            state.calendarYear = y;
            render();
        }

        function toggleTaskCompletion(taskId) {
            const today = new Date();

            const rec = ensureDayRecord(todayKey);
            const list = rec[state.period];

            if (idx >= 0) {
                list.splice(idx, 1);
            } else {
                list.push(taskId);
                playCheckSound();
            }
            saveState();
            render();

            if (idx < 0 && isPeriodFullyCompleted(state.period, today)) {
                playCompleteAllSound();
                launchConfetti();
                showToast(state.period === 'morning' ? '朝のルーティーンを達成しました' : '夜のルーティーンを達成しました');

        function moveRoutine(taskId, direction) {
            const periodTasks = state.routines
                .filter(r => r.period === state.period)
                .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            const idx = periodTasks.findIndex(r => r.id === taskId);
            const targetIdx = idx + direction;
            if (idx < 0 || targetIdx < 0 || targetIdx >= periodTasks.length) return;

            const temp = periodTasks[idx];
            periodTasks[idx] = periodTasks[targetIdx];
            periodTasks[targetIdx] = temp;

            periodTasks.forEach((task, i) => {
                task.order = i;
            });
            saveState();
            render();
        }

                state.routines.push({

                    period: formState.period,
                    duration,
                    days: [...formState.days],

        /* ==========================================================================
           タイマー付きガイドモード (Focus Mode)
           ========================================================================== */
        function startFocusMode(startTaskId = null) {
            const today = new Date();
            const todayKey = getDateKey(today);
            const allTasks = getTasksForDate(state.period, today);
            const completedIds = getCompletedIds(state.period, todayKey);
            let pendingTasks = allTasks.filter(t => !completedIds.includes(t.id));

            if (pendingTasks.length === 0) {
                showToast('今日の項目はすべて完了しています');
                return;
            }

            if (startTaskId) {
                const idx = pendingTasks.findIndex(t => t.id === startTaskId);
                if (idx > 0) {
                    const [picked] = pendingTasks.splice(idx, 1);
                    pendingTasks.unshift(picked);
                }
            }

            focusState.active = true;
            focusState.queue = pendingTasks;
            focusState.currentIndex = 0;

            loadFocusTask(0);

            const overlay = document.getElementById('focus-overlay');
            const t = getThemeClasses();
            overlay.className = `fixed inset-0 z-50 flex flex-col justify-between p-6 sm:p-8 transition-colors duration-500 overflow-y-auto ${t.bodyBg}`;
            document.getElementById('focus-badge').className = `text-[11px] font-medium px-3 py-1 rounded-full tracking-wide ${t.accentSoft}`;
            document.getElementById('focus-ring-progress').setAttribute('stroke', t.accentStroke);
            document.getElementById('focus-play-btn').className = `w-16 h-16 rounded-full flex items-center justify-center text-white shadow-lg transition-transform active:scale-95 ${t.accentBg}`;
            document.getElementById('focus-complete-btn').className = `w-full max-w-xs py-3.5 px-6 rounded-full text-sm font-medium text-white shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2 ${t.accentBg}`;
            document.getElementById('focus-next-preview').className = `inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs ${t.subtleBg} ${t.muted}`;

            startFocusTimer();
        }

        function loadFocusTask(index) {
            stopFocusTimer();
            const task = focusState.queue[index];
            if (!task) {
                closeFocusMode();
                return;
            }
            focusState.currentIndex = index;
            focusState.totalSec = (Number(task.duration) || 1) * 60;
            focusState.remainingSec = focusState.totalSec;

            document.getElementById('focus-period-label').textContent = state.period === 'morning' ? 'Morning Ritual' : 'Night Ritual';
            document.getElementById('focus-step-counter').textContent = `${index + 1} / ${focusState.queue.length}`;
            document.getElementById('focus-task-title').textContent = task.title;
            document.getElementById('focus-task-note').textContent = task.note || '';

            const nextTask = focusState.queue[index + 1];
            const nextEl = document.getElementById('focus-next-preview');
            if (nextTask) {
                nextEl.innerHTML = `<span>次：${escapeHtml(nextTask.title)}（${nextTask.duration}分）</span>`;
            } else {
                nextEl.innerHTML = `<span>これが最後の項目です</span>`;
            }

            updateFocusTimerUI();
        }

        function updateFocusTimerUI() {
            const mins = Math.floor(focusState.remainingSec / 60);
            const secs = focusState.remainingSec % 60;
            document.getElementById('focus-timer-display').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const circumference = 552.92; // 2 * PI * 88
            const ratio = focusState.totalSec > 0 ? focusState.remainingSec / focusState.totalSec : 0;
            const offset = circumference * (1 - ratio);
            document.getElementById('focus-ring-progress').style.strokeDashoffset = offset;

            const playBtn = document.getElementById('focus-play-btn');
            const statusText = document.getElementById('focus-timer-status');
            if (focusState.isRunning) {
                playBtn.innerHTML = `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
                statusText.textContent = '進行中';
            } else {
                playBtn.innerHTML = `<svg class="w-6 h-6 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
                statusText.textContent = focusState.remainingSec === 0 ? '時間になりました' : '一時停止中';
            }
        }

        function startFocusTimer() {
            if (focusState.isRunning) return;
            ensureAudioReady();
            focusState.isRunning = true;
            updateFocusTimerUI();
            focusState.intervalId = setInterval(() => {
                if (focusState.remainingSec > 0) {
                    focusState.remainingSec--;
                    updateFocusTimerUI();
                    if (focusState.remainingSec === 0) {
                        stopFocusTimer();
                        playTimerEndSound();
                    }
                }
            }, 1000);
        }

        function stopFocusTimer() {
            focusState.isRunning = false;
            if (focusState.intervalId) {
                clearInterval(focusState.intervalId);
                focusState.intervalId = null;
            }
            updateFocusTimerUI();
        }

        function toggleFocusTimer() {
            if (focusState.isRunning) {
                stopFocusTimer();
            } else {
                if (focusState.remainingSec === 0) {
                    focusState.remainingSec = 60;
                    focusState.totalSec = Math.max(focusState.totalSec, 60);
                }
                startFocusTimer();
            }
        }

        function addOneMinuteFocus() {
            focusState.remainingSec += 60;
            focusState.totalSec += 60;
            updateFocusTimerUI();
        }

        function skipFocusTask() {
            if (focusState.currentIndex + 1 < focusState.queue.length) {
                loadFocusTask(focusState.currentIndex + 1);
                startFocusTimer();
            } else {
                closeFocusMode();
            }
        }

        function completeCurrentFocusTask() {
            const task = focusState.queue[focusState.currentIndex];
            if (task) {
                const todayKey = getDateKey(new Date());
                const rec = ensureDayRecord(todayKey);
                if (!rec[state.period].includes(task.id)) {
                    rec[state.period].push(task.id);
                }
                saveState();
                playCheckSound();
            }

            if (focusState.currentIndex + 1 < focusState.queue.length) {
                loadFocusTask(focusState.currentIndex + 1);
                startFocusTimer();
            } else {
                closeFocusMode();
                render();
                if (isPeriodFullyCompleted(state.period, new Date())) {
                    playCompleteAllSound();
                    launchConfetti();
                    showToast('すべてのルーティーンを完了しました');
                }
            }
        }

        function closeFocusMode() {
            stopFocusTimer();
            focusState.active = false;
            const overlay = document.getElementById('focus-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            render();
        }

        /* ==========================================================================
           上品な紙吹雪エフェクト (Canvas)
           ========================================================================== */
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = state.period === 'morning'
                ? ['#C8793B', '#E5A358', '#F2D6B3', '#8C7A6B', '#FFFFFF']
                : ['#90A2FF', '#6D7EF2', '#DFC58E', '#C7D2FE', '#64748B'];

            const particles = Array.from({ length: 65 }, () => ({
                x: canvas.width * (0.2 + Math.random() * 0.6),
                y: canvas.height * 0.35 + (Math.random() - 0.5) * 60,
                vx: (Math.random() - 0.5) * 7.5,
                vy: -Math.random() * 8.5 - 3,
                size: Math.random() * 5.5 + 3,
                color: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.14,
                alpha: 1
            }));

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.vx *= 0.99;
                    p.rot += p.vRot;
                    if (frame > 45) p.alpha -= 0.02;
                    if (p.alpha > 0) {
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.55);
                        ctx.restore();
                    }
                });
                frame++;
                if (alive && frame < 140) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(animate);
        }

        /* ==========================================================================
           音声入力サポート (Web Speech API)
           ========================================================================== */
        const voiceState = {
            recognition: null,
            activeTargetId: null,
            isListening: false,
            baseText: '',
            options: {},
            finalRecognized: ''
        };

        function getSpeechRecognitionCtor() {
            return window.SpeechRecognition || window.webkitSpeechRecognition || null;
        }

        function getVoiceButtonForTarget(targetId) {
            if (targetId === 'task-title-input') return document.getElementById('voice-btn-task-title');
            if (targetId === 'task-note-input') return document.getElementById('voice-btn-task-note');
            if (targetId === 'today-journal-input') return document.getElementById('voice-btn-today-journal');
            return null;
        }

        function setVoiceButtonUI(targetId, listening) {
            const btn = getVoiceButtonForTarget(targetId);
            if (btn) {
                if (listening) {
                    btn.classList.add('voice-listening');
                    btn.setAttribute('title', 'タップして音声入力を停止');
                } else {
                    btn.classList.remove('voice-listening');
                    btn.setAttribute('title', '音声で入力');
                }
            }
            if (targetId === 'today-journal-input') {
                const statusEl = document.getElementById('voice-status-today-journal');
                if (statusEl) {
                    statusEl.textContent = listening ? '聴き取っています…' : '音声入力対応';
                }
            } else if (targetId === 'task-title-input') {
                const hintEl = document.getElementById('voice-hint-task-title');
                if (hintEl) {
                    hintEl.textContent = listening ? '話しかけてください…' : '「白湯を飲む 5分」のように話せます';
                }
            }
        }

        function stopVoiceInput() {
            if (voiceState.recognition) {
                try {
                    voiceState.recognition.stop();
                } catch (e) {}
            }
            if (voiceState.activeTargetId) {
                setVoiceButtonUI(voiceState.activeTargetId, false);
            }
            voiceState.isListening = false;
            voiceState.activeTargetId = null;
            voiceState.recognition = null;
        }

        function normalizeDigits(str) {
            return str.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
        }

        function toggleVoiceInput(targetId, options = {}) {
            const SpeechRecognition = getSpeechRecognitionCtor();
            if (!SpeechRecognition) {
                showToast('お使いのブラウザは音声入力に対応していません（Chrome / Safari推奨）');
                return;
            }

            // 同じ入力欄で録音中なら停止
            if (voiceState.isListening && voiceState.activeTargetId === targetId) {
                stopVoiceInput();
                return;
            }

            // 別の入力欄で録音中なら一度停止
            if (voiceState.isListening) {
                stopVoiceInput();
            }

            const inputEl = document.getElementById(targetId);
            if (!inputEl) return;

            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'ja-JP';
                recognition.interimResults = true;
                recognition.continuous = false;
                recognition.maxAlternatives = 1;

                voiceState.recognition = recognition;
                voiceState.activeTargetId = targetId;
                voiceState.isListening = true;
                voiceState.options = options;
                voiceState.baseText = inputEl.value.trim();
                voiceState.finalRecognized = '';

                setVoiceButtonUI(targetId, true);
                showToast('音声入力を開始しました。お話しください');

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript;
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    if (finalTranscript) {
                        voiceState.finalRecognized += finalTranscript;
                    }

                    const spoken = (voiceState.finalRecognized + interimTranscript).trim();
                    const el = document.getElementById(targetId);
                    if (!el) return;

                    // 既存テキストがある場合はスペースを挟んで追記（項目名が空ならそのまま）
                    const combined = voiceState.baseText && spoken
                        ? `${voiceState.baseText} ${spoken}`
                        : (spoken || voiceState.baseText);
                    const maxLen = parseInt(el.getAttribute('maxlength'), 10) || 80;
                    el.value = combined.slice(0, maxLen);
                };

                recognition.onerror = (event) => {
                    let msg = '音声の認識を中断しました';
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        msg = 'マイクの使用が許可されていません。ブラウザの設定をご確認ください';
                    } else if (event.error === 'no-speech') {
                        msg = '音声が検出されませんでした。もう一度お試しください';
                    } else if (event.error === 'network') {
                        msg = 'ネットワークエラーにより音声認識できませんでした';
                    }
                    showToast(msg);
                    stopVoiceInput();
                };

                recognition.onend = () => {
                    const finishedTarget = voiceState.activeTargetId;
                    const finishedOptions = voiceState.options || {};
                    const recognizedText = voiceState.finalRecognized.trim();

                    if (finishedTarget) {
                        setVoiceButtonUI(finishedTarget, false);
                    }
                    voiceState.isListening = false;
                    voiceState.activeTargetId = null;
                    voiceState.recognition = null;

                    const el = finishedTarget ? document.getElementById(finishedTarget) : null;
                    if (!el || !recognizedText) return;

                    // 項目名に「10分」などが含まれていれば所要時間を自動抽出
                    if (finishedOptions.parseDuration) {
                        const normalized = normalizeDigits(el.value);
                        const match = normalized.match(/(\d{1,3})\s*分/);
                        if (match) {
                            const mins = Math.max(1, Math.min(180, parseInt(match[1], 10)));
                            const durationInput = document.getElementById('task-duration-input');
                            if (durationInput) durationInput.value = mins;
                            const cleanedTitle = normalized.replace(/\s*\d{1,3}\s*分\s*/, ' ').trim();
                            if (cleanedTitle) el.value = cleanedTitle;
                            showToast(`音声入力を反映しました（所要時間 ${mins}分）`);
                            return;
                        }
                    }

                    // 今日のひとことメモは音声認識完了時に自動保存
                    if (finishedOptions.autoSaveJournalDate) {
                        saveDayJournal(finishedOptions.autoSaveJournalDate, finishedTarget);
                        return;
                    }

                    playCheckSound();
                    showToast('音声入力を反映しました');
                };

                recognition.start();
            } catch (e) {
                showToast('音声入力を開始できませんでした');
                stopVoiceInput();
            }
        }

        /* ==========================================================================
           ホーム画面起動（PWA / モバイルWebアプリ）サポート
           ========================================================================== */
        let deferredInstallPrompt = null;
        let cachedAppIconDataUrl = '';

        function isStandaloneMode() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function detectMobileOS() {
            const ua = navigator.userAgent || '';
            if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                return 'ios';
            }
            if (/Android/i.test(ua)) {
                return 'android';
            }
            return 'other';
        }

        // 4芒星（ダイヤ型のきらめき）を描画するヘルパー
        function drawSparkleStar(ctx, cx, cy, outerR, innerR, color) {
            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const r = i % 2 === 0 ? outerR : innerR;
                const angle = (i * Math.PI) / 4 - Math.PI / 2;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        // 洗練された「Sora & Tsuki」アプリアイコン(PNG Data URL)を同期生成
        function buildAppIconDataUrl() {
            if (cachedAppIconDataUrl) return cachedAppIconDataUrl;
            try {
                const size = 512;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // 1. 夜空から暁へと移ろう深いグラデーション背景
                const bgGrad = ctx.createLinearGradient(0, 0, size, size);
                bgGrad.addColorStop(0, '#0B1121');
                bgGrad.addColorStop(0.55, '#19223C');
                bgGrad.addColorStop(1, '#432D28');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, size, size);

                // 2. 月光と朝陽が溶け合う柔らかなアンビエント光
                const moonAura = ctx.createRadialGradient(225, 225, 10, 225, 225, 220);
                moonAura.addColorStop(0, 'rgba(236, 214, 166, 0.28)');
                moonAura.addColorStop(1, 'rgba(236, 214, 166, 0)');
                ctx.fillStyle = moonAura;
                ctx.fillRect(0, 0, size, size);

                const sunAura = ctx.createRadialGradient(315, 305, 10, 315, 305, 175);
                sunAura.addColorStop(0, 'rgba(226, 138, 66, 0.34)');
                sunAura.addColorStop(1, 'rgba(226, 138, 66, 0)');
                ctx.fillStyle = sunAura;
                ctx.fillRect(0, 0, size, size);

                // 3. 天球儀をイメージした二重の繊細なゴールドリング
                ctx.beginPath();
                ctx.arc(256, 256, 176, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(232, 207, 160, 0.34)';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.save();
                ctx.setLineDash([4, 10]);
                ctx.beginPath();
                ctx.arc(256, 256, 162, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(232, 207, 160, 0.22)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                // 4. なめらかなベジェ曲線で描くシャンパンゴールドの三日月
                ctx.save();
                ctx.shadowColor = 'rgba(245, 225, 180, 0.45)';
                ctx.shadowBlur = 24;
                const moonGrad = ctx.createLinearGradient(170, 150, 290, 340);
                moonGrad.addColorStop(0, '#F7E7C4');
                moonGrad.addColorStop(1, '#D3AE6E');
                ctx.fillStyle = moonGrad;

                ctx.beginPath();
                ctx.moveTo(278, 156);
                ctx.bezierCurveTo(192, 164, 158, 242, 186, 308);
                ctx.bezierCurveTo(212, 366, 286, 382, 336, 344);
                ctx.bezierCurveTo(274, 356, 222, 316, 218, 256);
                ctx.bezierCurveTo(214, 202, 244, 168, 278, 156);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // 5. 三日月の懐に寄り添うテラコッタ・アンバーの朝陽オーブ
                ctx.save();
                ctx.shadowColor = 'rgba(232, 146, 72, 0.55)';
                ctx.shadowBlur = 22;
                const sunGrad = ctx.createLinearGradient(272, 232, 336, 304);
                sunGrad.addColorStop(0, '#F2A65A');
                sunGrad.addColorStop(1, '#C86928');
                ctx.beginPath();
                ctx.arc(304, 266, 36, 0, Math.PI * 2);
                ctx.fillStyle = sunGrad;
                ctx.fill();
                ctx.restore();

                // 6. 静かに瞬く星々のアクセント
                drawSparkleStar(ctx, 326, 182, 13, 3.2, 'rgba(247, 231, 196, 0.92)');
                drawSparkleStar(ctx, 182, 186, 7, 1.8, 'rgba(247, 231, 196, 0.65)');
                ctx.beginPath();
                ctx.arc(352, 222, 2.8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(247, 231, 196, 0.75)';
                ctx.fill();

                cachedAppIconDataUrl = canvas.toDataURL('image/png');
                return cachedAppIconDataUrl;
            } catch (e) {
                return '';
            }
        }

        // iOS Safari / Android Chrome 両対応のアイコン＆マニフェスト即時登録
        function applyAppIconsAndManifest() {
            const iconDataUrl = buildAppIconDataUrl();
            if (!iconDataUrl) return;

            const appleIcon = document.getElementById('apple-touch-icon');
            if (appleIcon) appleIcon.setAttribute('href', iconDataUrl);

            const favicon = document.getElementById('favicon-link');
            if (favicon) favicon.setAttribute('href', iconDataUrl);

            const preview = document.getElementById('install-icon-preview');
            if (preview) {
                preview.innerHTML = `<img src="${iconDataUrl}" alt="Sora & Tsuki アイコン" class="w-full h-full object-cover">`;
            }

            try {
                const startUrl = window.location.href.split('#')[0];
                const manifest = {
                    name: 'Sora & Tsuki — 朝と夜のルーティーン',
                    short_name: 'Sora & Tsuki',
                    description: '朝と夜のルーティーンを心地よく続けるための管理アプリ',
                    start_url: startUrl,
                    display: 'standalone',
                    orientation: 'portrait',
                    background_color: '#0B1121',
                    theme_color: state.period === 'morning' ? '#F6F2EB' : '#090D18',
                    icons: [
                        { src: iconDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any' },
                        { src: iconDataUrl, sizes: '192x192', type: 'image/png', purpose: 'any' }
                    ]
                };
                const manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
                const manifestLink = document.getElementById('manifest-link');
                if (manifestLink) manifestLink.setAttribute('href', manifestDataUrl);
            } catch (e) {}
        }

        function initPwaSupport() {
            applyAppIconsAndManifest();

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredInstallPrompt = e;
            });

            window.addEventListener('appinstalled', () => {
                deferredInstallPrompt = null;
                closeInstallModal();
                applyTheme();
                showToast('ホーム画面に追加されました');
            });
        }

        function openInstallModal() {
            applyAppIconsAndManifest();
            const t = getThemeClasses();
            const modal = document.getElementById('install-modal');
            const card = document.getElementById('install-modal-card');
            card.className = `w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl animate-fade-up space-y-5 max-h-[90vh] overflow-y-auto ${t.isMorning ? 'bg-[#FAF7F2] text-morning-text' : 'bg-[#131A2C] text-night-text border border-slate-700/80'}`;

            const nativeSection = document.getElementById('native-install-section');
            const nativeBtn = document.getElementById('native-install-btn');
            if (deferredInstallPrompt) {
                nativeSection.classList.remove('hidden');
                nativeBtn.className = `w-full py-3.5 px-5 rounded-2xl text-sm font-medium text-white shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2 ${t.accentBg}`;
            } else {
                nativeSection.classList.add('hidden');
            }

            const os = detectMobileOS();
            const stepsContainer = document.getElementById('install-guide-steps');
            const stepBoxClass = `p-4 rounded-2xl ${t.subtleBg} space-y-2.5`;

            const iosGuide = `
                <div class="${stepBoxClass}">
                    <div class="font-medium flex items-center gap-2">
                        <span class="px-2 py-0.5 rounded-full text-[10px] ${t.accentSoft}">iPhone / Safari</span>
                        <span>ホーム画面への追加手順</span>
                    </div>
                    <ol class="space-y-1.5 opacity-85 list-decimal list-inside">
                        <li>画面下部の <strong>共有ボタン（□に↑）</strong> をタップします</li>
                        <li>メニューを下にスクロールし、<strong>「ホーム画面に追加」</strong> を選びます</li>
                        <li>上の専用アイコンが表示されていることを確認し、右上の <strong>「追加」</strong> をタップします</li>
                    </ol>
                </div>
            `;

            const androidGuide = `
                <div class="${stepBoxClass}">
                    <div class="font-medium flex items-center gap-2">
                        <span class="px-2 py-0.5 rounded-full text-[10px] ${t.accentSoft}">Android / Chrome</span>
                        <span>ホーム画面への追加手順</span>
                    </div>
                    <ol class="space-y-1.5 opacity-85 list-decimal list-inside">
                        <li>ブラウザ右上の <strong>メニュー（⋮）</strong> をタップします</li>
                        <li><strong>「アプリをインストール」</strong> または <strong>「ホーム画面に追加」</strong> を選びます</li>
                        <li>確認画面で <strong>「追加」</strong> をタップすると専用アイコンが配置されます</li>
                    </ol>
                </div>
            `;

            const hostNote = `
                <p class="text-[11px] ${t.muted} leading-relaxed px-1">
                    ※ すでに「S」のアイコンでホーム画面に追加済みの場合は、一度そのアイコンを削除し、GitHub等の公開URLを再読み込みしてからもう一度追加してください。
                </p>
            `;

            if (os === 'ios') {
                stepsContainer.innerHTML = iosGuide + hostNote;
            } else if (os === 'android') {
                stepsContainer.innerHTML = androidGuide + hostNote;
            } else {
                stepsContainer.innerHTML = iosGuide + androidGuide + hostNote;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeInstallModal() {
            const modal = document.getElementById('install-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function triggerNativeInstall() {
            if (!deferredInstallPrompt) return;
            try {
                deferredInstallPrompt.prompt();
                const choice = await deferredInstallPrompt.userChoice;
                if (choice && choice.outcome === 'accepted') {
                    showToast('インストールを開始しました');
                }
                deferredInstallPrompt = null;
                closeInstallModal();
            } catch (e) {
                showToast('ブラウザのメニューから「ホーム画面に追加」をお試しください');
            }
        }

        /* ==========================================================================
           初期化
           ========================================================================== */
        // ブラウザがホーム画面追加用のアイコンを早期取得できるよう即時生成
        applyAppIconsAndManifest();

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            initPwaSupport();
            render();
        });
    </script>
</body>
